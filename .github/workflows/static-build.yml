name: Static build verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker toolchain
        run: npm install
      - name: Build Worker and portable static site
        run: npm run build
      - name: Validate Wrangler Worker bundle and static asset binding
        run: npx wrangler deploy --dry-run
      - name: Verify migrated reference and workbook data
        working-directory: frontend
        run: npm run test:reference
      - name: Verify core calculations
        working-directory: frontend
        run: |
          npm run test:analysis
          npm run test:stock-metric-presentation
          npm run test:charts
          npm run test:providers
          npm run test:indicators
          npm run test:screener
          npm run test:workspace
          npm run test:industry
          npm run test:research
          npm run test:market-pulse
          npm run test:portfolio
          npm run test:integration
