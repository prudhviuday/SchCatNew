name = "schcatnew"
main = "worker/index.js"
compatibility_date = "2026-11-07"
workers_dev = true

# Isolated Cloudflare Worker Previews for non-production branches.
[previews.vars]
SCHCAT_ENV = "preview"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Server-side screener data persistence.
[[kv_namespaces]]
binding = "SCREENER_CACHE"
id = "134f223d739a489db012de16761acb49"
