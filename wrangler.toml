name = "schcatnew"
main = "worker/index.js"
compatibility_date = "2026-11-07"
workers_dev = true

# Isolated Cloudflare Worker Previews for non-production branches.
[previews.vars]
SCHCAT_ENV = "preview"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Server-side screener data persistence.
# One-time setup: run "npx wrangler kv namespace create SCREENER_CACHE".
# Then uncomment the binding below and replace the placeholder with the returned ID.
# [[kv_namespaces]]
# binding = "SCREENER_CACHE"
# id = "<YOUR_SCREENER_CACHE_NAMESPACE_ID>"
